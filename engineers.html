<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Engineers | ALMA</title>
  <meta name="description" content="ALMA engineers and network.">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <!-- Optional font CDN (Google Fonts). Remove these 3 lines to use system fonts. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="engineers" data-tab="explore" data-nav="public">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="app-header"></div>

  <main id="main" class="page container" tabindex="-1">

    <header class="page-head">
      <div>
        <h1>Engineers</h1>
        <p>Our team and network. Open a profile to see completed projects.</p>
      </div>
    </header>

    <div class="toolbar">
      <form class="search-bar" role="search" onsubmit="return false">
        <label for="eng-search" class="sr-only">Search engineers by name, role or specialty</label>
        <span data-icon="search"></span>
        <input id="eng-search" type="search" placeholder="Search by name, role or specialty..." autocomplete="off">
      </form>
      <div id="eng-filter" aria-label="Filter by discipline"></div>
    </div>

    <section aria-labelledby="eng-results">
      <h2 id="eng-results" class="sr-only">Engineers</h2>
      <p class="results-count" id="eng-count" aria-live="polite"></p>
      <div id="eng-list" class="dir-grid" style="margin-top:12px"></div>
    </section>
  </main>

  <div id="app-footer"></div>
  <div id="app-bottom-nav"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/engineers.js"></script>
</body>
</html>
