<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Projects | ALMA</title>
  <meta name="description" content="Completed and in-progress finishing projects by ALMA.">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <!-- Optional font CDN (Google Fonts). Remove these 3 lines to use system fonts. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="projects" data-tab="explore" data-nav="public">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="app-header"></div>

  <main id="main" class="page container" tabindex="-1">

    <header class="page-head">
      <div>
        <h1 id="projects-title">Projects</h1>
        <p id="projects-sub">Completed and in-progress work. Filter by room or search by name, area or style.</p>
      </div>
    </header>

    <div class="toolbar">
      <form class="search-bar" role="search" onsubmit="return false">
        <label for="project-search" class="sr-only">Search projects by title, location or tag</label>
        <span data-icon="search"></span>
        <input id="project-search" type="search" placeholder="Search for designs, materials, styles..." autocomplete="off">
      </form>
      <div id="category-filter" aria-label="Filter by category"></div>
      <div id="status-filter" aria-label="Filter by status"></div>
    </div>

    <section aria-labelledby="results-label">
      <h2 id="results-label" class="sr-only">Results</h2>
      <p class="results-count" id="results-count" aria-live="polite"></p>
      <div id="project-list" class="card-list grid-2" style="margin-top:12px"></div>
    </section>
  </main>

  <div id="app-footer"></div>
  <div id="app-bottom-nav"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/projects.js"></script>
</body>
</html>
